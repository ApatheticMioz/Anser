# ============================================================================
# Anser — Continuous Integration
# ============================================================================
# Cross-platform test gate for the mcp-qwen (Anser) microkernel.
#
# Matrix: Node 22 & 24 (Active LTS) × ubuntu-latest & windows-latest (4 jobs).
#
# `npm ci` (not `npm install`) is used for deterministic installs from
# package-lock.json. This is REQUIRED for the platform-specific @ast-grep
# optional dependencies (napi/cli) to resolve the correct native binary for
# the runner OS (linux-x64-gnu/musl on Ubuntu, win32-x64-msvc on Windows).
#
# All test suites (36 suites in test:all) run directly in a single pass to
# eliminate duplicate test execution and minimize CI duration.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref to keep the queue snappy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test · Node ${{ matrix.node-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Don't fail-fast: we want all 4 matrix cells to report independently so
      # a single platform/Node failure doesn't mask the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          # The lock file lives in the mcp-qwen/ subdirectory (no root
          # package.json), so point the cache at that path explicitly.
          cache-dependency-path: mcp-qwen/package-lock.json

      - name: Install dependencies (npm ci)
        working-directory: mcp-qwen
        run: npm ci

      - name: Report environment
        run: |
          echo "=============================================="
          echo " CI environment"
          echo "   OS:        ${{ runner.os }} (${{ runner.arch }})"
          echo "   Node:      $(node --version)"
          echo "   npm:       $(npm --version)"
          echo "   platform:  $(node -p 'process.platform')"
          echo "=============================================="

      - name: Run test:all (36-suite authoritative gate)
        working-directory: mcp-qwen
        run: npm run test:all

      - name: Summary
        if: always()
        run: |
          echo "=============================================="
          echo " Anser test gate complete on ${{ runner.os }} / Node ${{ matrix.node-version }}"
          echo "=============================================="
