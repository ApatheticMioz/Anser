# ============================================================================
# Castor — Automated Release Pipeline
# ============================================================================
# Triggered on version tags (e.g. `v1.0.0`).
#
# 1. Runs the Rust test gate and clippy check.
# 2. Creates the GitHub Release with generated release notes.
# 3. Publishes `mcp-castor` to npm with OIDC Trusted Publishing (--provenance).
# ============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Verify · Rust stable · ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build all targets
        run: cargo build --all-targets

      - name: Run clippy (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests (authoritative gate)
        run: cargo test --verbose

      - name: Test Node shim
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bin/castor.js --help

  publish:
    name: GitHub Release & NPM Publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Extract Tag Version
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "Castor ${{ steps.meta.outputs.version }}" \
            --generate-notes \
            --draft=false \
            --prerelease=false

      - name: Publish to NPM
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          npm publish --access public --provenance --tag release
          npm dist-tag add mcp-castor@${{ steps.meta.outputs.version }} latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
