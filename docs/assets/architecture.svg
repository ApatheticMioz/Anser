<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%" style="background:#080c14; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#140d2b"/>
    </linearGradient>

    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082b45"/>
      <stop offset="100%" stop-color="#091829"/>
    </linearGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063228"/>
      <stop offset="100%" stop-color="#081e19"/>
    </linearGradient>

    <linearGradient id="localGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d08"/>
      <stop offset="100%" stop-color="#1f1107"/>
    </linearGradient>

    <linearGradient id="badgeGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Ambient Grid Background -->
  <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161f30" stroke-width="0.7"/>
  </pattern>
  <rect width="900" height="550" fill="url(#gridPattern)"/>

  <!-- ================= LAYER 1: CLOUD ORCHESTRATOR ================= -->
  <g transform="translate(30, 20)">
    <rect width="840" height="92" rx="10" fill="url(#cloudGrad)" stroke="#7c3aed" stroke-width="1.2"/>
    
    <!-- Title icon & text -->
    <text x="24" y="30" fill="#f8fafc" font-size="15" font-weight="700" letter-spacing="0.3">LEAD ARCHITECT (Cloud Orchestrator)</text>
    <text x="24" y="47" fill="#cbd5e1" font-size="11.5">Google Antigravity · Gemini 3.8 Flash · Claude Code · High-Reasoning Cloud Authority</text>

    <!-- Roles / Pills -->
    <g transform="translate(24, 58)">
      <g transform="translate(0, 0)">
        <rect width="240" height="24" rx="5" fill="#2e1065" stroke="#9333ea" stroke-width="0.8"/>
        <text x="12" y="16" fill="#e9d5ff" font-size="11" font-weight="600">Architecture &amp; Task Planning</text>
      </g>

      <g transform="translate(252, 0)">
        <rect width="210" height="24" rx="5" fill="#2e1065" stroke="#9333ea" stroke-width="0.8"/>
        <text x="12" y="16" fill="#e9d5ff" font-size="11" font-weight="600">Multimodal Vision Review</text>
      </g>

      <g transform="translate(474, 0)">
        <rect width="318" height="24" rx="5" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
        <text x="12" y="16" fill="#6ee7b7" font-size="11" font-weight="700">★ Zero Bulk Code Hoarding into Cloud</text>
      </g>
    </g>
  </g>

  <!-- Connector 1 -> 2 -->
  <line x1="450" y1="112" x2="450" y2="138" stroke="#c084fc" stroke-width="2" marker-end="url(#arrPurple)"/>
  <rect x="345" y="117" width="210" height="18" rx="4" fill="#090d16" stroke="#4c1d95" stroke-width="0.8"/>
  <text x="450" y="130" fill="#d8b4fe" font-size="10" font-weight="600" text-anchor="middle">Standard MCP Protocol (stdio)</text>

  <!-- ================= LAYER 2: MODEL CONTEXT PROTOCOL ================= -->
  <g transform="translate(30, 142)">
    <rect width="840" height="74" rx="10" fill="url(#mcpGrad)" stroke="#0284c7" stroke-width="1.2"/>
    
    <text x="24" y="22" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="0.8">CONSOLIDATED MCP TOOL INTERFACE</text>

    <!-- Tool 1 -->
    <g transform="translate(24, 30)">
      <rect width="250" height="34" rx="6" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="0.8"/>
      <text x="12" y="21" fill="#f0f9ff" font-size="12" font-weight="700">qwen_coworker</text>
      <text x="126" y="21" fill="#7dd3fc" font-size="10.5">AST Surgery &amp; Edits</text>
    </g>

    <!-- Tool 2 -->
    <g transform="translate(295, 30)">
      <rect width="250" height="34" rx="6" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="0.8"/>
      <text x="12" y="21" fill="#f0f9ff" font-size="12" font-weight="700">qwen_task</text>
      <text x="96" y="21" fill="#7dd3fc" font-size="10.5">Telemetry &amp; OS Wait</text>
    </g>

    <!-- Tool 3 -->
    <g transform="translate(566, 30)">
      <rect width="250" height="34" rx="6" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="0.8"/>
      <text x="12" y="21" fill="#f0f9ff" font-size="12" font-weight="700">qwen_server</text>
      <text x="110" y="21" fill="#7dd3fc" font-size="10.5">Engine Auto-Heal</text>
    </g>
  </g>

  <!-- Connector 2 -> 3 -->
  <line x1="450" y1="216" x2="450" y2="242" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan)"/>
  <rect x="335" y="221" width="230" height="18" rx="4" fill="#090d16" stroke="#0369a1" stroke-width="0.8"/>
  <text x="450" y="234" fill="#7dd3fc" font-size="10" font-weight="600" text-anchor="middle">In-Process V8 Tool Calls (0.01 ms)</text>

  <!-- ================= LAYER 3: ANSER MICROKERNEL ================= -->
  <g transform="translate(30, 246)">
    <rect width="840" height="110" rx="10" fill="url(#coreGrad)" stroke="#059669" stroke-width="1.2"/>
    
    <text x="24" y="28" fill="#f8fafc" font-size="15" font-weight="700" letter-spacing="0.3">ANSER IN-PROCESS AGENT MICROKERNEL (:18021)</text>
    <text x="24" y="45" fill="#a7f3d0" font-size="11.5">Zero Subprocess Spawning Overhead · Self-Contained Execution &amp; Security Boundary</text>

    <!-- 4 Clean Cards -->
    <g transform="translate(24, 56)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="190" height="42" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
        <text x="10" y="18" fill="#ecfdf5" font-size="11" font-weight="700">5-Layer Sandbox</text>
        <text x="10" y="32" fill="#6ee7b7" font-size="9.5">137 Containment Vectors</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(200, 0)">
        <rect width="190" height="42" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
        <text x="10" y="18" fill="#ecfdf5" font-size="11" font-weight="700">Structural AST Surgery</text>
        <text x="10" y="32" fill="#6ee7b7" font-size="9.5">ast-grep N-API Service</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(400, 0)">
        <rect width="190" height="42" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
        <text x="10" y="18" fill="#ecfdf5" font-size="11" font-weight="700">In-Memory Syntax Gate</text>
        <text x="10" y="32" fill="#6ee7b7" font-size="9.5">JS / TS / Python / JSON</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(600, 0)">
        <rect width="192" height="42" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
        <text x="10" y="18" fill="#ecfdf5" font-size="11" font-weight="700">Zero-Turn OS Wait</text>
        <text x="10" y="32" fill="#6ee7b7" font-size="9.5">curl :18021/wait ($0 Cost)</text>
      </g>
    </g>
  </g>

  <!-- Connector 3 -> 4 -->
  <line x1="450" y1="356" x2="450" y2="382" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen)"/>
  <rect x="325" y="361" width="250" height="18" rx="4" fill="#090d16" stroke="#047857" stroke-width="0.8"/>
  <text x="450" y="374" fill="#a7f3d0" font-size="10" font-weight="600" text-anchor="middle">Stream Proxy (:18022) / Direct Inference (:18020)</text>

  <!-- ================= LAYER 4: LOCAL SERVING ENGINE ================= -->
  <g transform="translate(30, 386)">
    <rect width="840" height="142" rx="10" fill="url(#localGrad)" stroke="#ea580c" stroke-width="1.2"/>
    
    <text x="24" y="28" fill="#f8fafc" font-size="15" font-weight="700" letter-spacing="0.3">LOCAL COWORKER &amp; SERVING ENGINE ($0 Token Cost)</text>
    <text x="24" y="45" fill="#fed7aa" font-size="11.5">Model-Agnostic: Qwen3.8-27B · vLLM · Ollama · llama.cpp · Remote Endpoints</text>

    <!-- 3 Engine Capability Cards -->
    <g transform="translate(24, 56)">
      <!-- Box 1 -->
      <g transform="translate(0, 0)">
        <rect width="256" height="42" rx="6" fill="#451a03" stroke="#d97706" stroke-width="0.8"/>
        <text x="12" y="18" fill="#fef3c7" font-size="11.5" font-weight="700">Universal 245K Context</text>
        <text x="12" y="32" fill="#fcd34d" font-size="10">KVarN Tiled 4b/2b KV Cache</text>
      </g>

      <!-- Box 2 -->
      <g transform="translate(268, 0)">
        <rect width="256" height="42" rx="6" fill="#451a03" stroke="#d97706" stroke-width="0.8"/>
        <text x="12" y="18" fill="#fef3c7" font-size="11.5" font-weight="700">Speculative Block Drafter</text>
        <text x="12" y="32" fill="#fcd34d" font-size="10">DFlash2 1.92B (4.59 tok/step)</text>
      </g>

      <!-- Box 3 -->
      <g transform="translate(536, 0)">
        <rect width="256" height="42" rx="6" fill="#451a03" stroke="#d97706" stroke-width="0.8"/>
        <text x="12" y="18" fill="#fef3c7" font-size="11.5" font-weight="700">Vision CPU Offloading</text>
        <text x="12" y="32" fill="#fcd34d" font-size="10">268K Tokens Preserved in VRAM</text>
      </g>
    </g>

    <!-- Bottom Punchline Banner -->
    <g transform="translate(24, 106)">
      <rect width="792" height="24" rx="5" fill="url(#badgeGreen)"/>
      <text x="396" y="16" fill="#090d16" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">
        ★ ELIMINATES 90%+ OF CLOUD API BILLS · ALL REPO INGESTION &amp; TEST LOOPS AT $0 COST ★
      </text>
    </g>
  </g>
</svg>
