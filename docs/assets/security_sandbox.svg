<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="100%" style="background:#080c14; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0b111e"/>
    </linearGradient>

    <linearGradient id="astBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063228"/>
      <stop offset="100%" stop-color="#071e19"/>
    </linearGradient>

    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <marker id="chev" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Ambient Grid Background -->
  <pattern id="gridSub2" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161f30" stroke-width="0.7"/>
  </pattern>
  <rect width="900" height="230" fill="url(#gridSub2)"/>

  <!-- Title / Header -->
  <g transform="translate(30, 18)">
    <text x="0" y="16" fill="#f8fafc" font-size="14" font-weight="700" letter-spacing="0.4">5-LAYER ZERO-TRUST SANDBOX PIPELINE</text>
    <text x="0" y="32" fill="#94a3b8" font-size="11">137 Automated Containment Vectors (123 Attacks Blocked · 14 Allow-Vectors Permitted)</text>
  </g>

  <!-- The 5 Steps -->
  <g transform="translate(30, 60)">
    <!-- Layer 1 -->
    <g transform="translate(0, 0)">
      <rect width="152" height="96" rx="8" fill="url(#cardBg)" stroke="#0284c7" stroke-width="1"/>
      <circle cx="18" cy="18" r="9" fill="#0284c7" fill-opacity="0.3"/>
      <text x="18" y="21" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">1</text>
      <text x="34" y="22" fill="#f1f5f9" font-size="11.5" font-weight="700">PathEscape</text>
      <line x1="8" y1="34" x2="144" y2="34" stroke="#1e293b" stroke-width="0.8"/>
      <text x="10" y="50" fill="#94a3b8" font-size="9.5">Blocks ../../ traversal</text>
      <text x="10" y="66" fill="#94a3b8" font-size="9.5">Blocks C:\ &amp; /mnt/c</text>
      <text x="10" y="82" fill="#64748b" font-size="9">NUL, CON, PRN guards</text>
    </g>

    <!-- Arrow 1->2 -->
    <line x1="154" y1="48" x2="170" y2="48" stroke="#38bdf8" stroke-width="2" marker-end="url(#chev)"/>

    <!-- Layer 2 -->
    <g transform="translate(172, 0)">
      <rect width="152" height="96" rx="8" fill="url(#cardBg)" stroke="#0284c7" stroke-width="1"/>
      <circle cx="18" cy="18" r="9" fill="#0284c7" fill-opacity="0.3"/>
      <text x="18" y="21" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">2</text>
      <text x="34" y="22" fill="#f1f5f9" font-size="11.5" font-weight="700">Symlink Real</text>
      <line x1="8" y1="34" x2="144" y2="34" stroke="#1e293b" stroke-width="0.8"/>
      <text x="10" y="50" fill="#94a3b8" font-size="9.5">fs.realpathSync audit</text>
      <text x="10" y="66" fill="#94a3b8" font-size="9.5">Blocks symlink escapes</text>
      <text x="10" y="82" fill="#64748b" font-size="9">Rejects link breakouts</text>
    </g>

    <!-- Arrow 2->3 -->
    <line x1="326" y1="48" x2="342" y2="48" stroke="#38bdf8" stroke-width="2" marker-end="url(#chev)"/>

    <!-- Layer 3 -->
    <g transform="translate(344, 0)">
      <rect width="152" height="96" rx="8" fill="url(#cardBg)" stroke="#0284c7" stroke-width="1"/>
      <circle cx="18" cy="18" r="9" fill="#0284c7" fill-opacity="0.3"/>
      <text x="18" y="21" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">3</text>
      <text x="34" y="22" fill="#f1f5f9" font-size="11.5" font-weight="700">Root Guard</text>
      <line x1="8" y1="34" x2="144" y2="34" stroke="#1e293b" stroke-width="0.8"/>
      <text x="10" y="50" fill="#94a3b8" font-size="9.5">Locks workspace root</text>
      <text x="10" y="66" fill="#94a3b8" font-size="9.5">Blocks parent deletion</text>
      <text x="10" y="82" fill="#64748b" font-size="9">Immutable base anchor</text>
    </g>

    <!-- Arrow 3->4 -->
    <line x1="498" y1="48" x2="514" y2="48" stroke="#38bdf8" stroke-width="2" marker-end="url(#chev)"/>

    <!-- Layer 4 -->
    <g transform="translate(516, 0)">
      <rect width="152" height="96" rx="8" fill="url(#cardBg)" stroke="#0284c7" stroke-width="1"/>
      <circle cx="18" cy="18" r="9" fill="#0284c7" fill-opacity="0.3"/>
      <text x="18" y="21" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">4</text>
      <text x="34" y="22" fill="#f1f5f9" font-size="11.5" font-weight="700">Shell Filter</text>
      <line x1="8" y1="34" x2="144" y2="34" stroke="#1e293b" stroke-width="0.8"/>
      <text x="10" y="50" fill="#94a3b8" font-size="9.5">Blocks rm -rf /</text>
      <text x="10" y="66" fill="#94a3b8" font-size="9.5">Blocks format &amp; dd</text>
      <text x="10" y="82" fill="#64748b" font-size="9">Neutralizes fork bombs</text>
    </g>

    <!-- Arrow 4->5 -->
    <line x1="670" y1="48" x2="686" y2="48" stroke="#34d399" stroke-width="2" marker-end="url(#chev)"/>

    <!-- Layer 5 (AST Gate) -->
    <g transform="translate(688, 0)">
      <rect width="152" height="96" rx="8" fill="url(#astBg)" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="18" cy="18" r="9" fill="#059669" fill-opacity="0.3"/>
      <text x="18" y="21" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">5</text>
      <text x="34" y="22" fill="#ecfdf5" font-size="11.5" font-weight="700">AST Gate</text>
      <line x1="8" y1="34" x2="144" y2="34" stroke="#059669" stroke-width="0.8"/>
      <text x="10" y="50" fill="#a7f3d0" font-size="9.5">In-Memory syntax check</text>
      <text x="10" y="66" fill="#6ee7b7" font-size="9.5">TS/JS/Python/JSON</text>
      <text x="10" y="82" fill="#34d399" font-size="9" font-weight="700">Reverts byte-for-byte</text>
    </g>
  </g>

  <!-- Bottom Result Banner -->
  <g transform="translate(30, 172)">
    <rect width="840" height="30" rx="6" fill="url(#bannerGrad)"/>
    <text x="420" y="20" fill="#080c14" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">
      ✓ ZERO-TRUST WORKSPACE CONTAINMENT · 137 TEST VECTORS VERIFIED CLEAN
    </text>
  </g>
</svg>
