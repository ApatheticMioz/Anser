[package]
name = "castor"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
description = "Castor: Rust MCP toolchain, proxy, and evo engine"

[[bin]]
name = "castor"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.5.0", features = ["server", "client", "transport-child-process"] }
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
encoding_rs = "0.8.42"
thiserror = "2.0.21"
schemars = "1.2.2"
async-trait = "0.1.92"
